name: データの更新と配信

on:
  schedule:
    - cron: "17 */6 * * *" # 6時間ごと（日本時間 3:17、9:17、15:17、21:17）
  workflow_dispatch: # 手動実行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 取得に失敗すると以降は実行されず、前回のデータがそのまま配信され続ける
      - name: データを取得
        run: node fetch-data.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 配信
        id: deploy
        uses: actions/deploy-pages@v4
